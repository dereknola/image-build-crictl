---
name: "Update crictl version"

sources:
  crictl:
    name: "Get the three latest crictl minor versions"
    kind: shell
    spec:
      shell: /bin/bash
      command: |
        set -euo pipefail
        versions="$({
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer {{ requiredEnv .github.token }}' \
            'https://api.github.com/repos/kubernetes-sigs/cri-tools/releases?per_page=100' |
            jq -r '[.[] | select(.draft | not) | select(.prerelease | not) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[]' |
            sort -Vr |
            awk -F. '!seen[$1 FS $2]++' |
            head -n 3
        })"

        if [[ "$(printf '%s\n' "$versions" | wc -l)" -ne 3 ]]; then
          echo "Expected three crictl minor versions, found: $versions" >&2
          exit 1
        fi

        printf '%s\n' "$versions"

targets:
  tagfile:
    name: "Bump the three latest crictl minor versions in TAG"
    kind: file
    sourceid: crictl
    scmid: default
    spec:
      file: TAG

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump the three latest crictl minor versions'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
    scmid: default